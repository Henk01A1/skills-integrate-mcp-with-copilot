<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <main>
      <section id="auth-container">
        <h3>Student Account</h3>
        <div id="auth-status" class="hidden"></div>
        <form id="auth-form">
          <div class="form-group" id="name-group">
            <label for="name">Name:</label>
            <input type="text" id="name" required maxlength="100" />
          </div>
          <div class="form-group" id="grade-group">
            <label for="grade-level">Grade:</label>
            <input type="number" id="grade-level" min="9" max="12" required />
          </div>
          <div class="form-group">
            <label for="auth-email">Email:</label>
            <input type="email" id="auth-email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" required minlength="8" />
          </div>
          <button type="submit" id="auth-submit">Create account</button>
          <button type="button" id="auth-toggle" class="secondary-btn">I already have an account</button>
        </form>
        <form id="profile-form" class="hidden">
          <div class="form-group">
            <label for="profile-name">Name:</label>
            <input type="text" id="profile-name" required maxlength="100" />
          </div>
          <div class="form-group">
            <label for="profile-grade">Grade:</label>
            <input type="number" id="profile-grade" min="9" max="12" required />
          </div>
          <button type="submit">Save profile</button>
          <button type="button" id="logout-btn" class="secondary-btn">Log out</button>
        </form>
      </section>

      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
